<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:18px/1.4 Arial,sans-serif;background:#f1f4f7;color:#18212b}#scene{width:960px;height:720px;position:relative;overflow:hidden}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;background:white;border-bottom:1px solid #cdd6df;gap:16px}#name{font-size:17px;line-height:1.3;max-width:735px}#badge{font-size:12px;color:#536270;text-align:right;max-width:170px}#screen{position:absolute;left:16px;top:68px;width:928px;height:440px;background:#e4eaf0;border:1px solid #c5d0da;overflow:hidden}#shot{position:absolute}#box{position:absolute;border:3px solid #e0262d;z-index:2;box-shadow:0 0 0 2px white;pointer-events:none}#arrow{position:absolute;z-index:3;overflow:visible}#pointer{position:absolute;width:27px;height:34px;background:#162331;clip-path:polygon(0 0,0 100%,28% 75%,48% 100%,67% 88%,48% 64%,83% 61%);filter:drop-shadow(1px 1px 1px #fff);z-index:5}#press{position:absolute;width:30px;height:24px;border:3px solid #df222b;background:#fff9;border-radius:3px;z-index:4;display:none}footer{position:absolute;left:20px;right:20px;top:522px;bottom:15px}#index{font-size:13px;font-weight:bold;color:#29658b;margin-bottom:4px}h1{font-size:21px;line-height:1.2;margin:0 0 8px}p{font-size:18px;line-height:1.35;margin:0}#progress{position:absolute;left:0;bottom:0;height:4px;background:#1a7b67}#result{position:absolute;right:28px;top:78px;padding:5px 8px;background:#e7f5ee;color:#176047;border:1px solid #91c6ac;font-size:13px;z-index:4;display:none}
</style></head><body><div id="scene"><header><strong id="name"></strong><span id="badge"></span></header><div id="screen"><img id="shot" alt="Учебный экран приложения"><div id="box"></div><svg id="arrow" width="80" height="60"><path d="M2 2 L66 48 M49 46 L66 48 L61 32" fill="none" stroke="white" stroke-width="8"/><path d="M2 2 L66 48 M49 46 L66 48 L61 32" fill="none" stroke="#e0262d" stroke-width="4"/></svg><div id="pointer"></div><div id="press"></div></div><span id="result">Проверка результата</span><footer><div id="index"></div><h1 id="title"></h1><p id="text"></p></footer><div id="progress"></div></div><script>
const $=id=>document.getElementById(id);let aim={x:0,y:0},clickable=false;
window.setScene=async d=>{
 $('name').textContent=d.name;$('badge').textContent=d.reconstructed?'Пример':'';
 $('index').textContent=`ШАГ ${d.index} ИЗ ${d.total}`;$('title').textContent=d.title;
 $('title').hidden=true;$('text').textContent=d.text;
 $('progress').style.width=(d.index/d.total*100)+'%';$('result').style.display=d.result?'block':'none';
 clickable=d.action==='click';$('pointer').style.display=clickable?'block':'none';
 const scale=Math.min(924/d.width,436/d.height),ox=(928-d.width*scale)/2,oy=(440-d.height*scale)/2;
 $('shot').src=d.image;Object.assign($('shot').style,{left:ox+'px',top:oy+'px',width:d.width*scale+'px',height:d.height*scale+'px'});
 await $('shot').decode();const r=d.rect,x=ox+r.x*scale,y=oy+r.y*scale,w=r.width*scale,h=r.height*scale;
 Object.assign($('box').style,{left:(x-3)+'px',top:(y-3)+'px',width:(w+6)+'px',height:(h+6)+'px'});
 aim={x:Math.min(899,x+w*.7),y:Math.min(400,y+h*.65)};
 const ax=Math.max(3,Math.min(844,x-72)),ay=Math.max(3,y-60);Object.assign($('arrow').style,{left:ax+'px',top:ay+'px'});
 const endx=Math.max(5,Math.min(75,x+8-ax)),endy=Math.max(5,Math.min(56,y+8-ay));
 $('arrow').querySelectorAll('path').forEach(p=>p.setAttribute('d',`M2 2 L${endx} ${endy} M${endx-17} ${endy-2} L${endx} ${endy} L${endx-5} ${endy-16}`));
 $('text').style.fontSize='18px';if($('text').getBoundingClientRect().bottom>704)$('text').style.fontSize='16px';setPhase(0);
};
window.setPhase=n=>{Object.assign($('pointer').style,{left:(aim.x+(3-n)*13)+'px',top:(aim.y+(3-n)*10)+'px'});Object.assign($('press').style,{left:(aim.x-13)+'px',top:(aim.y-9)+'px',display:clickable&&n===3?'block':'none'});};
window.textFits=()=>document.querySelector('footer p').getBoundingClientRect().bottom<=705&&$('name').getBoundingClientRect().bottom<=58;
</script></body></html>
